<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EcoRuta Temuco - Detalle</title>

  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/detalle.css">
</head>

<body>

  <header class="barra">
    <div class="marca">
      <span class="logo">🌳</span>
      <div>
        <strong>EcoRuta</strong>
        <small>TEMUCO · CL</small>
      </div>
    </div>

    <nav class="navegacion" aria-label="Navegación principal">
      <a href="../index.html">Inicio</a>
      <a href="catalogo.html">Catálogo</a>
      <a href="detalle.html">Detalle</a>
      <a href="contacto.html">Contacto</a>
    </nav>

    <div class="barra-derecha">
      <span class="puntos">
        <i class="p1"></i>
        <i class="p2"></i>
        <i class="p3"></i>
      </span>

      <!-- Selector de idioma interactivo -->
      <details class="language-dropdown">
        <summary class="dropdown-toggle" aria-label="Cambiar idioma">
          <span>🇨🇱</span> 
          <span>CL ES</span>
          <span class="arrow">▼</span>
        </summary>
        <ul class="dropdown-menu" role="menu">
          <li>
            <button class="dropdown-item active" role="menuitem" type="button">
              <span>🇨🇱</span> Español (CL)
            </button>
          </li>
          <li>
            <button class="dropdown-item" role="menuitem" type="button">
              <span>🇬🇧</span> English (UK)
            </button>
          </li>
          <li>
            <button class="dropdown-item" role="menuitem" type="button">
              <span>🇧🇷</span> Português (BR)
            </button>
          </li>
        </ul>
      </details>
    </div>
  </header>

  <main class="contenido">
    <article class="detalle">
      <p class="detalle-titulo">
        PARQUE NACIONAL CONGUILLÍO
      </p>
      <h1>Parque Nacional Conguillío</h1>
      <p>
        El Parque Nacional Conguillío es uno de los destinos naturales
        más conocidos de La Araucanía.
      </p>
      <div class="tags">
        <span>Trekking</span>
        <span>Volcán</span>
        <span>Fotografía</span>
      </div>
    </article>
  </main>

</body>
</html>
